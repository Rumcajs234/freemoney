<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Brute Force Atak na Opuszczony Portfel</title>
</head>
<body>
    <h1>Brute Force Atak na Opuszczony Portfel</h1>
    <form id="form" onsubmit="startAttack()">
        Wprowadź adres portfela: <input type="text" id="address" placeholder="Adres portfela">
        <button typemodif="submit">Start ataku</button>
    </form>

    <div id="results"></div>

    <script>
        const addresses = [
            "BTC",
            "LTC",
            "ETH",
            "USDT",
            "TRX",
            "SOL",
            "BNB",
            "XMR",
            "DGB"
        ];

        let attackRunning = false;

        function startAttack() {
            const addressInput = document.getElementById("address").value;
            const form = document.getElementById("form");

            if (attackRunning) {
                console.log("Atak już jest w trakcie.");
                return false;
            }

            form.style.display = "none";
            attackRunning = true;

            setTimeout(() => {
                for (const address of addresses) {
                    setTimeout(() => {
                        const cryptoItem = document.createElement("li");
                        cryptoItem.textContent = address;
                        const resultsDiv = document.getElementById("results");

                        if (address === addressInput.toUpperCase()) {
                            console.log(`Znaleziono portfel z ${address} na adresie: ${addressInput}`);
                            displayResult(address, addressInput);
                        }

                        resultsDiv.appendChild(cryptoItem);

                        setTimeout(() => {
                            resultsDiv.scrollTop = resultsDiv.scrollHeight;
                        }, 100);
                    }, 1000 * (addresses.indexOf(address) + 1));
                }

                setTimeout(() => {
                    form.style.display = "block";
                    attackRunning = false;
                }, 5000);
            }, 1000);
        }

        function displayResult(crypto, address) {
            const resultsDiv = document.getElementById("results");
            const resultItem = document.createElement("p");
            resultItem.textContent = `Znaleziono portfel z ${crypto} na adresie: ${address}`;
            resultsDiv.appendChild(resultItem);

            setTimeout(() => {
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
            }, 100);
        }
    </script>
</body>
</html>
